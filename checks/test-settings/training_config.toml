# Training settings for the neural defenders. 

[networks]
hidden_sizes = [64, 64]

[advantages]
gamma = 0.99
gae_lambda = 0.95

[ppo]
actor_learning_rate = 0.0003
critic_learning_rate = 0.001
clip_epsilon = 0.2
epochs = 4
minibatch_size = 64
entropy_coefficient = 0.01

[training]
episodes_per_iteration = 16
iterations = 500
